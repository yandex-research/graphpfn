function = "bin.graphpfn.evaluate.main"
n_seeds = 10

[base_config]
amp = true
checkpoint_name = "none"
unfreeze_all = true
n_steps = -1
epoch_size = 10
patience = 4
seq_len_pred = 1024
min_train_ratio = 0.75

[base_config.ensemble]
shuffle_features = true
shuffle_targets = false
n_members = 10

[base_config.model]
n_random_features = 8

[base_config.model.edge_head]

[base_config.data]
cache = false
path = "data/twitch-views"
setting = "transductive"
internal_split_name = "RL"

[base_config.transform]
labels = true

[base_config.transform.features]
seed = 0
cat_policy = "ordinal"
num_policy = "quantile-normal"
frac_policy = "quantile-uniform"

[base_config.optimizer]
type = "AdamW"
lr = 0.00029974215431138873
weight_decay = 0.0
