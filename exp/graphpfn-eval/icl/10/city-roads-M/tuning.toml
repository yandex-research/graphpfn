seed = 0
n_trials = 100
sampler_type = "BruteForceSampler"
function = "bin.graphpfn.evaluate.main"

[space]
seed = 0
amp = true
checkpoint_name = "graphpfn-v1_2"
unfreeze_all = true
n_steps = 0
epoch_size = 10
patience = 4
seq_len_pred = 1024
min_train_ratio = 0.75

[space.data]
cache = false
path = "data/city-roads-M"
setting = "transductive"
num_policy = "noisy-quantile-normal"
ratio_policy = "noisy-quantile-uniform"
cat_policy = "ordinal"
internal_split_name = "RL"

[space.optimizer]
type = "AdamW"
lr = 0.0003
weight_decay = 0.0

[space.ensemble]
shuffle_features = true
shuffle_targets = true
n_members = 10

[space.model]
n_random_features = 8

[space.model.edge_head]
