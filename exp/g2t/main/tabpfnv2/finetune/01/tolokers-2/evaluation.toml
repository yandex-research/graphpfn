function = "bin.g2t.g2t_fm.main"
n_seeds = 10

[base_config]
patience = 16
amp = true
n_epochs = -1
epoch_size = 10
min_train_ratio = 0.75
seq_len_pred = 1024
finetune_mode = "full"

[base_config.tfm]
name = "tabpfnv2"

[base_config.ensemble]
shuffle_features = false
shuffle_targets = false
n_members = 1

[base_config.encodings.lappe]
k = 14

[base_config.encodings.degree]
log = true

[base_config.encodings.pagerank]
log = true

[base_config.nfa]

[base_config.data]
cache = false
path = "data/tolokers-2"
setting = "transductive"
internal_split_name = "RL"

[base_config.transform]
labels = false

[base_config.transform.features]
seed = 0
cat_policy = "ordinal"
num_policy = "quantile-normal"
frac_policy = "quantile-uniform"

[base_config.transform.encodings]
num_policy = "quantile-normal"

[base_config.transform.nfa]
seed = 0
cat_policy = "ordinal"
num_policy = "quantile-normal"
frac_policy = "quantile-uniform"

[base_config.optimizer]
type = "AdamW"
lr = 0.00029974215431138873
weight_decay = 0.0

[base_config.pearl]
batch_size = 8
d_output = 16

[base_config.pearl.backbone]
type = "BaseGraphBackbone"
conv_name = "gcn"
norm_name = "none"
residual = false
n_layers = 3
d_hidden = 512
dropout = 0.1
activation = "gelu"
