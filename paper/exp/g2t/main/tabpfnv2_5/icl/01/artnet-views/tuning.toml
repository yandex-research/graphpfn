seed = 0
function = "bin.g2t.g2t_fm.main"
n_trials = 100
sampler_type = "BruteForceSampler"

[space]
seed = 0
patience = 16
amp = true
n_epochs = 0
epoch_size = 10
min_train_ratio = 0.75
seq_len_pred = 1024
finetune_mode = "full"

[space.ensemble]
shuffle_features = false
shuffle_targets = false
n_members = 1

[space.tfm]
name = "tabpfn"

[space.tfm.config]
version = "v2.5"

[space.encodings.lappe]
k = 14

[space.encodings.degree]
log = true

[space.encodings.pagerank]
log = true

[space.nfa]

[space.data]
cache = false
path = "data/artnet-views"
setting = "transductive"
internal_split_name = "RL"

[space.transform]
labels = true

[space.transform.features]
seed = 0
cat_policy = "ordinal"
num_policy = "quantile-normal"
frac_policy = "quantile-uniform"

[space.transform.encodings]
num_policy = "quantile-normal"

[space.transform.nfa]
seed = 0
cat_policy = "ordinal"
num_policy = "quantile-normal"
frac_policy = "quantile-uniform"

[space.optimizer]
type = "AdamW"
lr = 0.0003
weight_decay = 0.0

[space.pearl]
batch_size = 8
d_output = 16

[space.pearl.backbone]
type = "BaseGraphBackbone"
conv_name = "gcn"
norm_name = "none"
residual = false
n_layers = 3
d_hidden = 512
dropout = 0.1
activation = "gelu"
