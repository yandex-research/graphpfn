seed = 0
function = "bin.base.gnn.main"
n_trials = 100
sampler_type = "BruteForceSampler"

[space]
seed = 0
n_steps = 1000
patience = 100

[space.data]
cache = false
path = "data/hm-prices"
setting = "transductive"
add_self_loops = false
internal_split_name = "RL"

[space.transform]
labels = true

[space.transform.features]
seed = 0
cat_policy = "one-hot"
num_policy = "quantile-normal"
frac_policy = [
    "_tune_",
    "categorical",
    [
        "quantile-normal",
        "none",
    ],
]

[space.model.backbone]
type = "BaseGraphBackbone"
conv_name = "gcn"
norm_name = "layer"
residual = true
n_layers = 3
d_hidden = 512
dropout = [
    "_tune_",
    "categorical",
    [
        0.0,
        0.1,
        0.2,
    ],
]
activation = "gelu"

[space.optimizer]
type = "AdamW"
lr = [
    "_tune_",
    "categorical",
    [
        3e-05,
        0.0001,
        0.0003,
        0.001,
        0.003,
    ],
]
weight_decay = 0.0
